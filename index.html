<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>ISS HUD – Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <!-- Font futuristico -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" />

  <style>
    :root {
      --bg-main: #050810;
      --bg-panel: #0b1220;
      --accent: #00eaff;
      --accent-soft: rgba(0, 234, 255, 0.3);
      --warning: #ff3b3b;
      --text-main: #e5f4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #101626 0, #050810 55%);
      color: var(--text-main);
      font-family: "Share Tech Mono", monospace;
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #map {
      width: 100%;
      height: 100%;
      filter: saturate(1.2) contrast(1.1);
    }

    /* Pannello HUD principale */
    .hud-panel {
      position: absolute;
      top: 2rem;
      left: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(5, 12, 25, 0.95), rgba(5, 20, 40, 0.9));
      border: 1px solid var(--accent-soft);
      box-shadow:
        0 0 20px rgba(0, 234, 255, 0.25),
        0 0 60px rgba(0, 234, 255, 0.15);
      backdrop-filter: blur(10px);
      min-width: 260px;
    }

    .hud-title {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .hud-divider {
      height: 1px;
      background: linear-gradient(to right, var(--accent), transparent);
      margin: 0.4rem 0 0.7rem;
      opacity: 0.7;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.8rem;
    }

    .hud-label {
      opacity: 0.7;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .hud-value {
      color: var(--accent);
      font-size: 0.9rem;
    }

    .hud-status {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0.8;
    }

    .hud-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      margin-right: 0.4rem;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Overlay reticolo HUD */
    .hud-grid-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0, 234, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 234, 255, 0.06) 1px, transparent 1px);
      background-size: 80px 80px;
      mix-blend-mode: screen;
      opacity: 0.4;
    }

    /* Cerchio radar */
    .hud-radar {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid var(--accent-soft);
      box-shadow: 0 0 20px rgba(0, 234, 255, 0.2);
      overflow: hidden;
    }

    .hud-radar::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 234, 255, 0.25), transparent 60%);
      opacity: 0.4;
    }

    .hud-radar-sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(0, 234, 255, 0.4),
        transparent 40%
      );
      animation: sweep 3s linear infinite;
      mix-blend-mode: screen;
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hud-radar-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--accent);
    }

    .hud-radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(0, 234, 255, 0.4);
      inset: 20%;
    }

    .hud-radar-ring:nth-child(2) { inset: 35%; }
    .hud-radar-ring:nth-child(3) { inset: 50%; }

    /* Marker ISS personalizzato */
    .iss-marker {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow:
        0 0 10px rgba(0, 234, 255, 0.9),
        0 0 25px rgba(0, 234, 255, 0.7);
      border: 2px solid #ffffff;
    }
	
	/* Glow dinamico sui segmenti del trail */
	.leaflet-overlay-pane .trail-segment {
	  filter: drop-shadow(0 0 6px rgba(0, 234, 255, 0.8))
			  drop-shadow(0 0 12px rgba(0, 234, 255, 0.4));
	  transition: opacity 0.4s linear;
	}
	
		/* HUD Gauge generico */
	.hud-gauge {
	  position: absolute;
	  width: 160px;
	  height: 160px;
	  border-radius: 50%;
	  background: rgba(0, 234, 255, 0.05);
	  border: 1px solid rgba(0, 234, 255, 0.2);
	  box-shadow: 0 0 20px rgba(0, 234, 255, 0.15);
	  backdrop-filter: blur(6px);
	}

	/* Posizioni */
	.speed-gauge {
	  top: 2rem;
	  right: 2rem;
	}

	.alt-gauge {
	  top: 2rem;
	  right: 12rem;
	}

	/* Cerchio gauge */
	.gauge-circle {
	  position: relative;
	  width: 100%;
	  height: 100%;
	  border-radius: 50%;
	  overflow: hidden;
	}

	/* Riempimento circolare */
	.gauge-fill {
	  position: absolute;
	  inset: 0;
	  border-radius: 50%;
	  background: conic-gradient(
		var(--accent) 0deg,
		transparent 0deg
	  );
	  filter: drop-shadow(0 0 10px var(--accent));
	  transition: background 0.3s linear;
	}

	/* Copertura centrale */
	.gauge-cover {
	  position: absolute;
	  inset: 25%;
	  border-radius: 50%;
	  background: rgba(5, 12, 25, 0.9);
	  border: 1px solid rgba(0, 234, 255, 0.2);
	  display: flex;
	  flex-direction: column;
	  justify-content: center;
	  align-items: center;
	}

	.gauge-label {
	  font-size: 0.6rem;
	  letter-spacing: 0.15em;
	  opacity: 0.7;
	}

	.gauge-value {
	  font-size: 1rem;
	  color: var(--accent);
	  margin-top: 0.2rem;
	}


  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>

    <div class="hud-grid-overlay"></div>

    <div class="hud-panel">
      <div class="hud-title">ISS – LIVE TELEMETRY</div>
      <div class="hud-divider"></div>
      <div class="hud-grid">
        <div>
          <div class="hud-label">Latitudine</div>
          <div class="hud-value" id="lat">--.--</div>
        </div>
        <div>
          <div class="hud-label">Longitudine</div>
          <div class="hud-value" id="lon">--.--</div>
        </div>
        <div>
          <div class="hud-label">Velocità</div>
          <div class="hud-value" id="speed">-- km/h</div>
        </div>
        <div>
          <div class="hud-label">Altitudine</div>
          <div class="hud-value" id="alt">-- km</div>
        </div>
      </div>
      <div class="hud-status">
        <span class="hud-dot"></span>
        LINK: ISS / UPDATE <span id="interval-label">1s</span>
      </div>
    </div>

    <div class="hud-radar">
      <div class="hud-radar-sweep"></div>
      <div class="hud-radar-center"></div>
      <div class="hud-radar-ring"></div>
      <div class="hud-radar-ring"></div>
      <div class="hud-radar-ring"></div>
    </div>
	
	<!-- HUD Velocità -->
	<div class="hud-gauge speed-gauge">
	  <div class="gauge-circle">
		<div class="gauge-fill" id="speed-fill"></div>
		<div class="gauge-cover">
		  <div class="gauge-label">VELOCITÀ</div>
		  <div class="gauge-value" id="speed-gauge-value">-- km/h</div>
		</div>
	  </div>
	</div>

	<!-- HUD Altitudine -->
	<div class="hud-gauge alt-gauge">
	  <div class="gauge-circle">
		<div class="gauge-fill" id="alt-fill"></div>
		<div class="gauge-cover">
		  <div class="gauge-label">ALTITUDINE</div>
		  <div class="gauge-value" id="alt-gauge-value">-- km</div>
		</div>
	  </div>
	</div>

  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

	<script>
	const API_URL = "https://api.wheretheiss.at/v1/satellites/25544";
	const UPDATE_INTERVAL_MS = 1000; // 1 secondo

	const latEl = document.getElementById("lat");
	const lonEl = document.getElementById("lon");
	const speedEl = document.getElementById("speed");
	const altEl = document.getElementById("alt");

	// Inizializza mappa
	const map = L.map("map", {
	  worldCopyJump: true,
	  zoomControl: false,
	  attributionControl: false
	}).setView([0, 0], 3);

	// CARTO DARK MATTER (tema scuro)
	L.tileLayer("https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png", {
	  maxZoom: 7,
	  minZoom: 2
	}).addTo(map);

	// Marker ISS personalizzato
	const issIcon = L.divIcon({
	  className: "",
	  html: '<div class="iss-marker"></div>',
	  iconSize: [18, 18],
	  iconAnchor: [9, 9]
	});

	const issMarker = L.marker([0, 0], { icon: issIcon }).addTo(map);

	// Trail ISS avanzato stile razzo
	let trailCoords = [];
	const maxTrailPoints = 300; // 5 minuti a 1 punto/sec
	let trailSegments = [];

	async function fetchISS() {
	  try {
		const res = await fetch(API_URL);
		if (!res.ok) throw new Error("HTTP " + res.status);
		const data = await res.json();

		const lat = data.latitude;
		const lon = data.longitude;
		const alt = data.altitude; // km
		const speed = data.velocity; // km/h

		// Aggiorna UI
		latEl.textContent = lat.toFixed(2);
		lonEl.textContent = lon.toFixed(2);
		altEl.textContent = alt.toFixed(1) + " km";
		speedEl.textContent = speed.toFixed(1) + " km/h";

		// Aggiorna marker
		issMarker.setLatLng([lat, lon]);

		// Aggiorna trail stile razzo
		trailCoords.push([lat, lon]);
		if (trailCoords.length > maxTrailPoints) {
		  trailCoords.shift();
		}

		// Rimuovi i vecchi segmenti
		trailSegments.forEach(seg => map.removeLayer(seg));
		trailSegments = [];

		// Ricrea i segmenti con fade e glow
		for (let i = 1; i < trailCoords.length; i++) {
		  const p1 = trailCoords[i - 1];
		  const p2 = trailCoords[i];

		  const age = i / trailCoords.length; // 0 → vecchio, 1 → nuovo
		  const opacity = age;
		  const segment = L.polyline([p1, p2], {
			color: `rgba(0, 234, 255, ${opacity})`,
			weight: 2 + age * 2,
			opacity: opacity,
			className: "trail-segment"
		  }).addTo(map);

		  trailSegments.push(segment);
		}

		// Centra la mappa solo al primo aggiornamento
		if (trailCoords.length === 1) {
		  map.setView([lat, lon], 3);
		}
		
		// Aggiorna tachimetro (velocità)
		const speedPercent = Math.min(speed / 30000, 1); // 0–30.000 km/h
		document.getElementById("speed-fill").style.background =
		  `conic-gradient(var(--accent) ${speedPercent * 360}deg, transparent 0deg)`;
		document.getElementById("speed-gauge-value").textContent =
		  speed.toFixed(0) + " km/h";

		// Aggiorna altimetro
		const altPercent = Math.min(alt / 500, 1); // 0–500 km
		document.getElementById("alt-fill").style.background =
		  `conic-gradient(var(--accent) ${altPercent * 360}deg, transparent 0deg)`;
		document.getElementById("alt-gauge-value").textContent =
		  alt.toFixed(1) + " km";

	  } catch (err) {
		console.error("Errore fetch ISS:", err);
	  }
	}

	// Primo fetch immediato
	fetchISS();
	// Aggiornamento periodico
	setInterval(fetchISS, UPDATE_INTERVAL_MS);
	</script>

</body>
</html>
